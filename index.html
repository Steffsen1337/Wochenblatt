<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🔒 BOT-SCHUTZ: Seite soll nicht in Suchmaschinen erscheinen -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">

<title>Wochenblatt – Archiv</title>
<script>
/* Theme möglichst früh setzen, damit kein Flackern entsteht */
(function () {
  try {
    var t = localStorage.getItem("wochenblattTheme");
    if (t === "dark" || t === "light") {
      document.documentElement.setAttribute("data-theme", t);
    }
  } catch (e) {}
})();
</script>
<style>
  /* ---------- Standard (hell) ---------- */
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f0f3f8;
    --border: #e2e7f0; --text: #1a1f2b; --text-dim: #667085;
    --accent: #2563eb; --accent-soft: rgba(37,99,235,0.10);
    --today: #0e9f6e; --today-soft: rgba(14,159,110,0.10);
    --shadow: 0 4px 20px rgba(20,30,60,0.08); --radius: 14px;
  }
  /* ---------- System-Dark ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #181b22; --surface-2: #1f232c;
      --border: #2a2f3a; --text: #e7eaf0; --text-dim: #9aa3b2;
      --accent: #4f8cff; --accent-soft: rgba(79,140,255,0.12);
      --today: #38d39f; --today-soft: rgba(56,211,159,0.12);
      --shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
  }
  /* ---------- Manueller Override ---------- */
  :root[data-theme="light"] {
    --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f0f3f8;
    --border: #e2e7f0; --text: #1a1f2b; --text-dim: #667085;
    --accent: #2563eb; --accent-soft: rgba(37,99,235,0.10);
    --today: #0e9f6e; --today-soft: rgba(14,159,110,0.10);
    --shadow: 0 4px 20px rgba(20,30,60,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --surface: #181b22; --surface-2: #1f232c;
    --border: #2a2f3a; --text: #e7eaf0; --text-dim: #9aa3b2;
    --accent: #4f8cff; --accent-soft: rgba(79,140,255,0.12);
    --today: #38d39f; --today-soft: rgba(56,211,159,0.12);
    --shadow: 0 4px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding: 24px 16px 60px;
    transition: background .3s, color .3s;
  }

  .wrap { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 32px; }

  .header-inner {
    display: flex; justify-content: space-between;
    align-items: flex-start; gap: 16px;
  }

  h1 {
    font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 6px;
    font-weight: 700; letter-spacing: -0.02em;
  }
  .subtitle { color: var(--text-dim); margin: 0; font-size: 0.95rem; }

  .theme-toggle {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); width: 46px; height: 46px; min-width: 46px;
    border-radius: 50%; cursor: pointer; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: var(--shadow);
    transition: border-color .2s, background .2s, transform .15s;
  }
  .theme-toggle:hover { border-color: var(--accent); background: var(--accent-soft); }
  .theme-toggle:active { transform: scale(.94); }

  h2 { font-size: 1.1rem; margin: 0 0 16px; font-weight: 600; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); margin-bottom: 24px;
    transition: background .3s, border-color .3s;
  }

  .date-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { font-size: 0.9rem; color: var(--text-dim); }

  input[type="date"], select {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 0.95rem;
    font-family: inherit; outline: none;
  }
  input[type="date"]:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .btn {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 10px 16px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn:hover { opacity: .9; }
  .btn:active { transform: scale(.98); }

  .week-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-top: 18px;
  }
  .week-card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-decoration: none;
    color: var(--text); display: block;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .week-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .week-card.current { border-color: var(--today); background: var(--today-soft); }
  .week-card .tag {
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim); font-weight: 600;
  }
  .week-card.current .tag { color: var(--today); }
  .week-card .kw { font-size: 1.5rem; font-weight: 700; margin: 6px 0 2px; }
  .week-card .range { font-size: 0.85rem; color: var(--text-dim); }

  .table-head {
    display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  thead th {
    text-align: left; padding: 12px 14px; background: var(--surface-2);
    color: var(--text-dim); font-weight: 600; font-size: 0.8rem;
    text-transform: uppercase; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.current-week { background: var(--today-soft); }
  tbody tr.current-week td:first-child {
    border-left: 3px solid var(--today); font-weight: 700; color: var(--today);
  }

  .kw-badge { display: inline-block; min-width: 34px; text-align: center; font-weight: 600; }

  a.pdf-link {
    color: var(--accent); text-decoration: none;
    font-weight: 600; white-space: nowrap;
  }
  a.pdf-link:hover { text-decoration: underline; }

  /* ---------- Mobile: Tabelle → Karten ---------- */
  @media (max-width: 640px) {
    .table-scroll { overflow: visible; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }

    tbody tr {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    }
    tbody tr:last-child { margin-bottom: 0; }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr.current-week {
      background: var(--today-soft); border-left: 4px solid var(--today);
    }
    tbody tr.current-week td:first-child { border-left: none; }
    tbody tr.current-week td:first-child .kw-badge {
      color: var(--today); font-weight: 700;
    }

    tbody td {
      border: none; padding: 5px 0; display: flex;
      justify-content: space-between; align-items: center;
      gap: 12px; font-size: 0.92rem;
    }
    tbody td::before {
      content: attr(data-label); font-weight: 600; color: var(--text-dim);
      font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.04em; flex-shrink: 0;
    }
    tbody td:first-child {
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px; margin-bottom: 6px; font-size: 1.05rem;
    }
    .kw-badge { min-width: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-inner">
      <div>
        <h1>📰 Wochenblatt-Archiv</h1>
        <p class="subtitle">Alle Ausgaben als PDF – nach Kalenderwoche sortiert.</p>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Design wechseln">🌙</button>
    </div>
  </header>

  <div class="card">
    <h2>🔎 Schnellzugriff</h2>
    <div class="date-row">
      <label for="dateInput">Beliebiges Datum:</label>
      <input type="date" id="dateInput">
      <button class="btn" id="todayBtn" type="button">Heute</button>
    </div>
    <div class="week-cards" id="weekCards"></div>
  </div>

  <div class="card">
    <div class="table-head">
      <h2 style="margin:0;">📅 Jahresübersicht</h2>
      <select id="yearSelect"></select>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>KW</th><th>Montag</th><th>Sonntag</th><th>PDF</th>
          </tr>
        </thead>
        <tbody id="yearBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
/* ---------- Datums-Helfer (ISO 8601) ---------- */
function isoWeek1Monday(year) {
  var jan4 = new Date(year, 0, 4);
  var day = (jan4.getDay() + 6) % 7;
  var monday = new Date(jan4);
  monday.setDate(jan4.getDate() - day);
  monday.setHours(0, 0, 0, 0);
  return monday;
}

function isoWeek(date) {
  var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  var dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  var firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  var firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
}

function isoWeekYear(date) {
  var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  var dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  return d.getUTCFullYear();
}

function isoWeeksInYear(year) { return isoWeek(new Date(year, 11, 28)); }

function formatDate(date) {
  var days = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  var dd = String(date.getDate()).padStart(2, "0");
  var mm = String(date.getMonth() + 1).padStart(2, "0");
  return days[date.getDay()] + ", " + dd + "." + mm + "." + date.getFullYear();
}

function pdfUrl(year, kw) {
  return "https://tvsatzstudio.de/Wochenblatt/" + year + "-" + kw + ".pdf";
}

function mondayOfIsoWeek(year, kw) {
  var w1 = isoWeek1Monday(year);
  var monday = new Date(w1);
  monday.setDate(w1.getDate() + (kw - 1) * 7);
  return monday;
}

function toInputValue(date) {
  var dd = String(date.getDate()).padStart(2, "0");
  var mm = String(date.getMonth() + 1).padStart(2, "0");
  return date.getFullYear() + "-" + mm + "-" + dd;
}

function dateFromInput(value) {
  var p = value.split("-");
  return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
}

/* ---------- DOM ---------- */
var dateInput   = document.getElementById("dateInput");
var weekCards   = document.getElementById("weekCards");
var yearSelect  = document.getElementById("yearSelect");
var yearBody    = document.getElementById("yearBody");
var todayBtn    = document.getElementById("todayBtn");
var themeToggle = document.getElementById("themeToggle");

/* ---------- Theme-Switch ---------- */
function effectiveTheme() {
  var pref = "auto";
  try { pref = localStorage.getItem("wochenblattTheme") || "auto"; } catch (e) {}
  if (pref === "dark" || pref === "light") return pref;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}

function updateToggleIcon(theme) {
  themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
  themeToggle.setAttribute("aria-label",
    theme === "dark" ? "Zu hellem Design wechseln" : "Zu dunklem Design wechseln");
}

function setTheme(theme) {
  if (theme === "dark" || theme === "light") {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("wochenblattTheme", theme); } catch (e) {}
  } else {
    document.documentElement.removeAttribute("data-theme");
    try { localStorage.removeItem("wochenblattTheme"); } catch (e) {}
  }
  updateToggleIcon(effectiveTheme());
}

themeToggle.addEventListener("click", function () {
  var next = effectiveTheme() === "dark" ? "light" : "dark";
  setTheme(next);
});

if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var mqListener = function () {
    var pref = "auto";
    try { pref = localStorage.getItem("wochenblattTheme") || "auto"; } catch (e) {}
    if (pref === "auto") updateToggleIcon(effectiveTheme());
  };
  if (mq.addEventListener) mq.addEventListener("change", mqListener);
  else if (mq.addListener) mq.addListener(mqListener);
}

/* ---------- Wochen-Karten ---------- */
function renderWeekCards(baseDate) {
  var cards = [
    { label: "Letzte Woche",   offset: -7 },
    { label: "Aktuelle Woche", offset:  0 },
    { label: "Kommende Woche", offset:  7 }
  ];
  weekCards.innerHTML = "";
  cards.forEach(function (c) {
    var d = new Date(baseDate);
    d.setDate(d.getDate() + c.offset);
    var year = isoWeekYear(d);
    var kw = isoWeek(d);
    var mon = mondayOfIsoWeek(year, kw);
    var sun = new Date(mon); sun.setDate(mon.getDate() + 6);

    var a = document.createElement("a");
    a.className = "week-card" + (c.offset === 0 ? " current" : "");
    a.href = pdfUrl(year, kw);
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<span class="tag">' + c.label + '</span>' +
      '<div class="kw">KW ' + kw +
        ' <span style="font-size:.85rem;font-weight:500;color:var(--text-dim)">/' + year + '</span></div>' +
      '<div class="range">' + formatDate(mon) + " – " + formatDate(sun) + '</div>';
    weekCards.appendChild(a);
  });
}

/* ---------- Jahres-Tabelle ---------- */
function renderYear(year) {
  var count = isoWeeksInYear(year);
  var now = new Date();
  var currentYear = isoWeekYear(now);
  var currentKw = isoWeek(now);
  yearBody.innerHTML = "";

  for (var kw = 1; kw <= count; kw++) {
    var mon = mondayOfIsoWeek(year, kw);
    var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    var tr = document.createElement("tr");
    if (year === currentYear && kw === currentKw) tr.className = "current-week";
    tr.innerHTML =
      '<td data-label="KW"><span class="kw-badge">' + kw + '</span></td>' +
      '<td data-label="Montag">' + formatDate(mon) + '</td>' +
      '<td data-label="Sonntag">' + formatDate(sun) + '</td>' +
      '<td data-label="PDF"><a class="pdf-link" href="' + pdfUrl(year, kw) +
        '" target="_blank" rel="noopener">Öffnen ↗</a></td>';
    yearBody.appendChild(tr);
  }
}

/* ---------- Events ---------- */
dateInput.addEventListener("change", function () {
  if (dateInput.value) renderWeekCards(dateFromInput(dateInput.value));
});

todayBtn.addEventListener("click", function () {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  dateInput.value = toInputValue(today);
  renderWeekCards(today);
  var y = today.getFullYear();
  var has = false;
  for (var i = 0; i < yearSelect.options.length; i++) {
    if (parseInt(yearSelect.options[i].value, 10) === y) { has = true; break; }
  }
  if (has) { yearSelect.value = y; renderYear(y); }
});

yearSelect.addEventListener("change", function () {
  renderYear(parseInt(yearSelect.value, 10));
  try { localStorage.setItem("wochenblattYear", yearSelect.value); } catch (e) {}
});

/* ---------- Init ---------- */
(function init() {
  var now = new Date(); now.setHours(0, 0, 0, 0);
  updateToggleIcon(effectiveTheme());

  var startYear = 2024;
  var endYear = Math.max(2030, now.getFullYear() + 2);
  yearSelect.innerHTML = "";
  for (var y = startYear; y <= endYear; y++) {
    var opt = document.createElement("option");
    opt.value = y; opt.textContent = y;
    yearSelect.appendChild(opt);
  }

  var startAt = now.getFullYear();
  try {
    var saved = parseInt(localStorage.getItem("wochenblattYear"), 10);
    if (!isNaN(saved) && saved >= startYear && saved <= endYear) startAt = saved;
  } catch (e) {}

  yearSelect.value = startAt;
  renderYear(startAt);
  dateInput.value = toInputValue(now);
  renderWeekCards(now);
})();
</script>
</body>
</html>
